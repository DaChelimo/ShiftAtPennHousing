# Phase 13a E2E — §6 paint a 30-min block on the preference grid, then submit.
#
# Android emulator + iOS simulator (Maestro). TDD-RED: selectors are the UI contract.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# Open the Preferences tab. It is the 7th tab (index 6) in the scrollable tab row,
# off-screen to the right at launch; swipe the tab row (≈9% height) right-to-left
# until it appears, then tap. Self-tuning + a no-op where the tab already fits.
- repeat:
    while:
      notVisible:
        id: "tab_preferences"
    commands:
      - swipe:
          start: 85%, 9%
          end: 35%, 9%
- tapOn:
    id: "tab_preferences"
- assertVisible:
    id: "preferences_screen"
- assertVisible:
    id: "pref_target_stepper"

# Pick the "Cannot" brush, then paint the first block in the day grid.
- tapOn:
    id: "pref_brush_cannot"
- assertVisible:
    id: "pref_block_grid"
- tapOn:
    id: "pref_block_cell"

# Submit the grid → the screen flips to the read-only "submitted" state.
- tapOn:
    id: "submit_preferences_button"
- assertVisible:
    text: "Submitted · read-only"
