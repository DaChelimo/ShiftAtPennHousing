name: CI

on:
  push:
    branches: [main, phase-*]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Type-check
        run: pnpm turbo run type-check

  test-core:
    name: Test — packages/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm --filter @shift/core test

  test-supabase:
    name: Test — Supabase (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop Supabase
        run: supabase stop

  build-android:
    name: Build — Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: apps/mobile
        run: ./gradlew :composeApp:assembleDebug --no-daemon

  # NOTE: the mobile app is now an Android-first Compose app
  # (apps/mobile/composeApp, scaffolded via the `android` CLI). The previous
  # iOS-simulator job targeted the Compose-Multiplatform `shared` module, which
  # no longer exists. iOS support is deferred to the Phase-13 mobile work and the
  # iOS CI job will be reintroduced if/when a Compose-Multiplatform target is added.
