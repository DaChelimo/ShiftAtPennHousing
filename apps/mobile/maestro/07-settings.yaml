# Phase 13a E2E — §6 open Settings and toggle the broadcast subscription.
#
# Android emulator + iOS simulator (Maestro). TDD-RED: selectors are the UI contract.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# Settings is an episodic destination → it lives behind the bottom-bar "More"
# overflow. Open More, then tap Settings in the sheet.
- tapOn:
    id: "tab_more"
- assertVisible:
    id: "more_sheet"
- tapOn:
    id: "tab_settings"
- assertVisible:
    id: "settings_screen"

# Toggle the one user-configurable channel ("General updates" / broadcast).
- assertVisible:
    id: "settings_broadcast_toggle"
- tapOn:
    id: "settings_broadcast_toggle"

# The Account group (incl. Sign out) sits below the fold in the settings list, so
# scroll the screen down to it before asserting (assertVisible does not auto-scroll
# the way tapOn does).
- scrollUntilVisible:
    element:
      id: "settings_sign_out"
    direction: DOWN
- assertVisible:
    id: "settings_sign_out"
