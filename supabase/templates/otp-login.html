<!--
  Passwordless sign-in email. Shows the one-time code prominently; deliberately does not
  present {{ .ConfirmationURL }} as a clickable link. A worker signing into a shared desk
  kiosk needs to type this code into the kiosk screen — a link opened from this email on
  their phone would authenticate the phone's browser instead of the kiosk.
-->
<div
  style="
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 24px;
    color: #1a1a1a;
  "
>
  <p style="font-size: 15px; margin: 0 0 24px;">Your SHIFT sign-in code:</p>
  <p
    style="
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 6px;
      margin: 0 0 24px;
      text-align: center;
      background: #f4f4f4;
      padding: 16px;
      border-radius: 8px;
    "
  >
    {{ .Token }}
  </p>
  <p style="font-size: 13px; color: #666; margin: 0;">
    Enter this code on the sign-in screen. It expires shortly and can only be used once. If
    you did not request this code, you can safely ignore this email.
  </p>
</div>
