# Swaps enhancement (DESIGN docs/swaps-enhancement/DESIGN.md §5/§7) — propose a swap with
# the §8.1 partial block-picker. From a My-Shifts card, pivot to the swap sheet, pick a
# counterparty, and the "hours to give" / "hours you want" range pickers appear, plus the
# "add another person" multi-leg entry. Proposing surfaces the confirmation toast.
#
# Android emulator + iOS simulator (Maestro). Selectors are the cross-platform UI contract.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# My Shifts (the calendar). Tapping a card opens the manage-shift sheet; the "Swap it"
# intent carries the selected range + scope into the week-paged swap sheet.
- tapOn:
    id: "tab_my_shifts"
- assertVisible:
    id: "calendar_shift_card"
- tapOn:
    id: "calendar_shift_card"
- assertVisible:
    id: "manage_shift_sheet"
- tapOn:
    id: "intent_swap"
- tapOn:
    id: "swap_continue_button"
- assertVisible:
    id: "swap_calendar_sheet"

# Pick a counterparty → the §8.1 partial pickers appear (give/take, the give pre-filled to
# the range chosen in the manage-shift sheet), and the multi-leg "add another person" entry.
- tapOn:
    id: "swap_take_row"
- assertVisible:
    id: "swap_give_range"

# Propose the swap → the housemate is asked; the request shows under the Swaps tab.
- tapOn:
    id: "swap_submit_button"
- assertVisible:
    id: "swap_proposed_toast"
