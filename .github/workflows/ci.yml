name: CI

on:
  push:
    branches: [main, phase-*]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Type-check
        run: pnpm turbo run type-check

  test-core:
    name: Test — packages/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm --filter @shift/core test

  test-supabase:
    name: Test — Supabase (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop Supabase
        run: supabase stop

  build-android:
    name: Build — Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK + shared unit tests
        working-directory: apps/mobile
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --no-daemon

  build-ios:
    name: Build — iOS (shared framework)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Link shared iOS framework + run iOS unit tests
        working-directory: apps/mobile
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 :shared:iosSimulatorArm64Test --no-daemon

  # NOTE: the mobile app is a Kotlin Multiplatform project (apps/mobile) following
  # Google's Fruitties pattern — shared logic in :shared, native UI per platform
  # (:androidApp Jetpack Compose, iosApp SwiftUI). The Android job builds the APK
  # and runs shared unit tests on the JVM host; the iOS job (macOS runner) links
  # the `Shared` framework and runs the shared unit tests on Kotlin/Native. The
  # iosApp Xcode project / signing is maintained outside CI.
