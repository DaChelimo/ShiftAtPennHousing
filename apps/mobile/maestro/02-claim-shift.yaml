# Phase 13a E2E — §5.3 claim an open shift; it then appears in My Shifts (the calendar).
#
# Android emulator + iOS simulator (Maestro). Selectors are the cross-platform UI contract.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# Open Shifts → My House (the default sub-tab). Pick the first claimable open shift; the
# claim affordance is absent/disabled once the shift is past its T-2h cutoff (§5.4).
- tapOn:
    id: "tab_open_shifts"
- assertVisible:
    id: "open_shift_card"
- tapOn:
    id: "claim_button"

# A claim that would push the worker over the 20h soft cap warns first, but is
# permitted (§5.3). Confirm through the warning if it is shown.
- runFlow:
    when:
      visible:
        id: "soft_cap_warning_modal"
    commands:
      - tapOn:
          id: "soft_cap_confirm_button"

- tapOn:
    id: "claim_confirm_button"
- assertVisible:
    id: "claim_success"

# The claimed shift is now held → it shows in My Shifts (the calendar agenda), since a
# claim mirrors into the calendar just like a drop leaves it (§5.6 #1 / §11.2).
- tapOn:
    id: "tab_my_shifts"
- assertVisible:
    id: "calendar_screen"
- assertVisible:
    id: "calendar_shift_card"
