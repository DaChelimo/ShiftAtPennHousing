# Phase 13a E2E — §6 (Phase 11) claim a break shift (FCFS) from the break picker.
#
# Android emulator + iOS simulator (Maestro). TDD-RED: selectors are the UI contract.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# Open the Break-shifts tab. It is the 8th tab (index 7) in the scrollable tab row,
# off-screen to the right at launch; swipe the tab row (≈9% height) right-to-left
# until it appears, then tap. Self-tuning + a no-op where the tab already fits.
- repeat:
    while:
      notVisible:
        id: "tab_break"
    commands:
      - swipe:
          start: 85%, 9%
          end: 35%, 9%
- tapOn:
    id: "tab_break"
- assertVisible:
    id: "break_claim_screen"
- assertVisible:
    id: "break_hours_meter"
- assertVisible:
    id: "break_shift_card"

# Claim the first claimable break shift → the "Break shift claimed" toast shows.
- tapOn:
    id: "break_claim_button"
- assertVisible:
    id: "break_claim_success"
