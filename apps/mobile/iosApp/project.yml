name: iosApp
options:
  bundleIdPrefix: com.pennhousing
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configFiles:
  Debug: Configuration/Config.xcconfig
  Release: Configuration/Config.xcconfig

# Declare an explicit SHARED scheme so `iosApp` is the committed, default run
# target. Without this, XcodeGen emits no scheme and Xcode auto-creates one per
# target, including the `ShiftWidgets` app-extension. Selecting/running the
# extension scheme makes Xcode try to inject the widget into the simulator
# gallery and fails with "Failed to show Widget 'com.pennhousing.shift.ShiftWidgets'"
# (SendProcessControlEvent … Code=8). The widget still builds: it is embedded as
# a dependency of `iosApp`, so building/running this scheme builds it too.
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

settings:
  base:
    PRODUCT_NAME: SHIFT
    # Ad-hoc sign on the simulator. This is REQUIRED for the configurable (AppIntent)
    # Open Shifts widget: an unsigned build fails AppIntents intent resolution
    # ("Couldn't communicate with a helper application" / "No AppIntent in
    # timeline(for:with:)") and the widget is stuck on its placeholder. The static
    # Upcoming widget works unsigned, but the configurable one does not.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: "-"
    # The signing team, checked in ON PURPOSE. It used to be set by hand on the widget
    # target in Xcode, which meant every `xcodegen generate` silently discarded it (twice
    # in one day on 2026-07-28) and device builds started failing to sign for no visible
    # reason. The generator owns project.pbxproj, so anything that must survive belongs
    # here, not in the .xcodeproj.
    #
    # This does NOT change simulator builds: CODE_SIGNING_REQUIRED=NO and the ad-hoc
    # identity above still win for the iphonesimulator SDK, which is what the configurable
    # widget needs. It only gives device builds a team to resolve automatic provisioning
    # against. (`TEAM_ID` in Configuration/Config.xcconfig is NOT the knob for this: it is
    # gitignored and nothing has ever read it.)
    DEVELOPMENT_TEAM: 3VC8F74G23
    CODE_SIGN_STYLE: Automatic

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "Info.plist"
      # The app/widget data contract (App Group snapshot models + deep links).
      - path: WidgetShared
    # NOTE: XcodeGen has no target-level `resources` key — this block is inert.
    # Everything here is actually swept in by `sources: path: iosApp` above,
    # including iosApp/Assets.xcassets (the app icon + accent colour, generated
    # by scripts/brand/build-icons.mjs). Do not add an `excludes` entry for the
    # catalog: that is what silently drops it from the bundle.
    resources:
      - iosApp/Fonts
      - iosApp/GoogleService-Info.plist
    # Embeds the widget extension into the app bundle.
    dependencies:
      - target: ShiftWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennhousing.shift
        INFOPLIST_FILE: iosApp/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        # The KMP :shared framework is built + embedded by the gradle run script below;
        # link against it from the xcode-frameworks output dir. Kept on the app target
        # (not the project base) so the widget extension does NOT try to link Shared.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build & embed KMP Shared framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        # Distinct from the app's "SHIFT" so the two Swift modules / product
        # dirs don't collide ("multiple commands produce …swiftmodule"), same reasoning as
        # ShiftWidgets above.
        PRODUCT_NAME: iosAppUITests
        TEST_TARGET_NAME: iosApp
        GENERATE_INFOPLIST_FILE: "YES"

  ShiftWidgets:
    type: app-extension
    platform: iOS
    # WidgetKit AppIntent configuration (the Open-shifts scope) needs iOS 17. The app
    # itself stays on 16; a widget target may target a higher OS than its host app.
    deploymentTarget: "17.0"
    sources:
      - path: ShiftWidgets
        excludes:
          - "Info.plist"
      - path: WidgetShared
    settings:
      base:
        # Distinct from the app's "SHIFT" so the two Swift modules /
        # product dirs don't collide ("multiple commands produce …swiftmodule").
        PRODUCT_NAME: ShiftWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.pennhousing.shift.ShiftWidgets
        INFOPLIST_FILE: ShiftWidgets/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"
        CODE_SIGN_ENTITLEMENTS: ShiftWidgets/ShiftWidgets.entitlements
