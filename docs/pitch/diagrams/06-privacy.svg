<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"
     font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#416180"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="120" y="112" font-size="26" font-weight="500" fill="#5d5d60" letter-spacing="5.7">SHIFT@PENNHOUSING</text>
  <text x="1800" y="112" font-size="26" font-weight="500" fill="#416180" letter-spacing="5.7" text-anchor="end">SECTION 8 / THE ASSISTANT</text>
  <text x="120" y="270" font-size="88" font-weight="600" fill="#1d1f20" letter-spacing="-1.3">In a world full of AI, privacy matters</text>
  <text x="120" y="381" font-size="40" font-weight="700" fill="#2b2b2d">I want to answer this one myself, because it is the right question to ask</text>

  <!-- ============ what comes in ============ -->
  <rect x="120" y="520" width="440" height="230" rx="14" fill="#f5f5f8" stroke="#dcdce1" stroke-width="1.8"/>
  <text x="340" y="580" font-size="26" font-weight="600" fill="#1d1f20" text-anchor="middle">What comes in</text>
  <text x="160" y="632" font-size="22" fill="#5d5d60">An incident at the desk</text>
  <text x="160" y="672" font-size="22" fill="#5d5d60">A page, and how it was handled</text>
  <text x="160" y="712" font-size="22" fill="#5d5d60">A manager's guidance afterwards</text>

  <line x1="580" y1="635" x2="656" y2="635" stroke="#416180" stroke-width="3" marker-end="url(#p1)"/>

  <!-- ============ the filter ============ -->
  <text x="900" y="480" font-size="24" font-weight="600" fill="#b8472d" text-anchor="middle">Nothing past this point identifies anyone</text>
  <path d="M900 496 L900 516" stroke="#b8472d" stroke-width="2.5"/>

  <rect x="666" y="520" width="468" height="230" rx="14" fill="#fdf2ee" stroke="#b8472d" stroke-width="2.5"/>
  <!-- scissors -->
  <g transform="translate(846,556)" stroke="#b8472d" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="12" cy="46" r="10"/><circle cx="44" cy="46" r="10"/>
    <path d="M18 38 L52 0"/><path d="M38 38 L4 0"/>
  </g>
  <text x="900" y="664" font-size="23" fill="#b8472d" text-anchor="middle">Names, student IDs, phone numbers,</text>
  <text x="900" y="698" font-size="23" fill="#b8472d" text-anchor="middle">anything pointing at a person,</text>
  <text x="900" y="732" font-size="23" font-weight="600" fill="#b8472d" text-anchor="middle">removed here</text>

  <line x1="1154" y1="635" x2="1230" y2="635" stroke="#416180" stroke-width="3" marker-end="url(#p1)"/>

  <!-- ============ what is kept ============ -->
  <rect x="1240" y="520" width="440" height="230" rx="14" fill="#0a1e32"/>
  <text x="1460" y="580" font-size="26" font-weight="600" fill="#94bce3" text-anchor="middle">What is kept</text>
  <text x="1460" y="648" font-size="26" fill="#f5f5f8" text-anchor="middle">The lesson.</text>
  <text x="1460" y="694" font-size="26" fill="#f5f5f8" text-anchor="middle">Nothing else.</text>

  <text x="1460" y="810" font-size="20" font-style="italic" fill="#7a7a7d" text-anchor="middle">So nobody can ask about a person</text>
  <text x="1460" y="838" font-size="20" font-style="italic" fill="#7a7a7d" text-anchor="middle">and get anything back.</text>

  <rect x="120" y="908" width="1680" height="2" fill="#e4e4e8"/>
  <text x="120" y="976" font-size="44" font-weight="600" fill="#1d1f20">The lesson is kept. The person is not.</text>

  <text x="120" y="1042" font-size="26" font-weight="500" fill="#7a7a7d" letter-spacing="5.2">19</text>
</svg>
