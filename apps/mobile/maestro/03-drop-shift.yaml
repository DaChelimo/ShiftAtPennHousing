# Phase 13a E2E — §5.2 drop a shift from the calendar agenda. A dropped shift is treated
# like any other dropped shift: it leaves the worker's agenda and surfaces in the
# Open-Shifts feed for anyone (incl. the worker) to claim — there is no "reclaim".
#
# Android emulator + iOS simulator (Maestro). Selectors are the cross-platform UI contract.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# My Shifts is the calendar now. Tapping an agenda card opens the drop-type popup:
# occurrence vs permanent (§5.2).
- tapOn:
    id: "tab_my_shifts"
- assertVisible:
    id: "calendar_screen"
- assertVisible:
    id: "calendar_shift_card"
- tapOn:
    id: "calendar_shift_card"
- assertVisible:
    id: "drop_options_sheet"
- assertVisible: "Drop this occurrence"
- assertVisible: "Drop permanently"
- tapOn:
    id: "drop_occurrence_option"

# Dropping a shift starting within 20 minutes warns before confirming (§5.2).
# Acknowledge the short-notice warning if it appears.
- runFlow:
    when:
      visible:
        id: "drop_short_notice_warning"
    commands:
      - tapOn:
          id: "drop_short_notice_continue"

- tapOn:
    id: "drop_confirm_button"
- assertNotVisible:
    id: "drop_options_sheet"

# The dropped occurrence is no longer the worker's shift — it now shows in the
# Open-Shifts feed (My House sub-tab), claimable (partial or full) like any open shift (§5.6 #2).
- tapOn:
    id: "tab_open_shifts"
- assertVisible:
    id: "open_shift_card"
