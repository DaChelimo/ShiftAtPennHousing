# Maestro workspace config for the Shift@PennHousing worker-app E2E flows.
# `maestro test apps/mobile/maestro/` runs every flow in the order below.
flows:
  - "[0-9][0-9]-*.yaml"
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 01-view-my-shifts
    - 02-claim-shift
    - 03-drop-shift
    - 04-acknowledge-float
    - 05-submit-preferences
    - 06-claim-break
    - 07-settings
    - 08-calendar-week
    - 09-my-shifts-week
    - 10-swaps-tab
    - 11-propose-partial-swap
    - 12-open-shifts-week
    - 13-house-grid
