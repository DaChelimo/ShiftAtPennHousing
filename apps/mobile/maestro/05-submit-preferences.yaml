# Phase 13a E2E — §6 paint a 30-min block on the preference grid, then submit.
#
# Android emulator + iOS simulator (Maestro). TDD-RED: selectors are the UI contract.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# Preferences is an episodic destination → it lives behind the bottom-bar "More"
# overflow. Open More, then tap Preferences in the sheet.
- tapOn:
    id: "tab_more"
- assertVisible:
    id: "more_sheet"
- tapOn:
    id: "tab_preferences"
- assertVisible:
    id: "preferences_screen"
- assertVisible:
    id: "pref_target_stepper"

# Pick the "Cannot" brush, then paint the first block on the day timeline. A single tap
# paints one 30-min block (humans long-press-drag to paint a range — not scriptable here).
- tapOn:
    id: "pref_brush_cannot"
- assertVisible:
    id: "pref_block_grid"
- tapOn:
    id: "pref_block_cell"

# Submit. The screen stays EDITABLE until the deadline (submitting is no longer final),
# so the banner confirms the submission without locking the grid. Maestro `text` is a
# full-match regex, so wildcard the banner title around the load-bearing phrase.
- tapOn:
    id: "submit_preferences_button"
- assertVisible:
    text: ".*you can still edit.*"
