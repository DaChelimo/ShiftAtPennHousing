# Break redesign E2E — §4.4 claim a break shift from the CALENDAR picker (drag → claim).
#
# Android emulator + iOS simulator (Maestro). Selectors are the UI contract
# (apps/mobile/maestro/README.md). Runs against the demo build, whose break calendar is in
# its CLAIM_WINDOW phase, so the active-break promotion banner shows on launch.
appId: com.pennhousing.shift
---
- launchApp:
    clearState: true

# B6 — while a break's claim window is open, the Break calendar is promoted with a banner
# on every tab. Tap it to open the calendar (it also lives behind More → Break shifts).
- assertVisible:
    id: "break_open_banner"
- tapOn:
    id: "break_open_banner"
- assertVisible:
    id: "break_calendar_screen"
- assertVisible:
    id: "break_hours_meter"
- assertVisible:
    id: "break_calendar_week_strip"
- assertVisible:
    id: "break_calendar_day"

# Tap an open block (a tap is a single-block selection) → the claim bar appears with the
# trim/coverage summary → claim it → the "Break shift claimed" toast shows.
- tapOn:
    id: "break_block_row"
- assertVisible:
    id: "break_calendar_claim_bar"
- tapOn:
    id: "break_calendar_claim_button"
- assertVisible:
    id: "break_calendar_success"
